<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V2.6.1 NOTAM validation</title><style>body{font:14px system-ui;margin:24px;color:#172033}main{max-width:1100px;margin:auto}.meta,.notice{background:#eef4fa;padding:12px;border-radius:8px}.notice{border-left:4px solid #d97706}table{border-collapse:collapse;width:100%;margin-top:16px}th,td{padding:8px;border:1px solid #d7dee8;text-align:left;vertical-align:top}th{background:#17375e;color:#fff}.MATCH{color:#166534}.INVESTIGATE{color:#9a3412}.EXPECTED{color:#475569}@media(max-width:700px){body{margin:10px}table{font-size:11px}}</style></head><body><main><h1>Soaring NOTAM V2.6.1 validation</h1><p class="notice"><strong>Developer/debug view only.</strong> Comparator data never changes production results. A disagreement requires investigation; it does not prove either source is correct.</p><div class="meta" id="case">Loading reproducible EHHV case…</div><p id="summary"></p><table><thead><tr><th>NOTAM</th><th>Soaring</th><th>Reference</th><th>Result</th><th>Differences</th></tr></thead><tbody id="rows"></tbody></table></main><script src="validation.js?v=2.6.1"></script><script>
const escape=value=>String(value??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('validation-data/ehhv-controlled-validation.json',{cache:'no-store'}).then(r=>r.json()).then(reference=>{const c=reference.test_case;document.getElementById('case').innerHTML=`<strong>${escape(c.name)}</strong><br>${escape(c.date)} ${escape(c.from_local)}–${escape(c.to_local)} ${escape(c.timezone)} · ${escape(c.max_altitude_ft)} ft · ${escape(c.corridor_km)} km<br>Task: ${escape(c.task_coordinates.map(p=>p.join(', ')).join(' → '))}<br>Validation: ${escape(reference.source)} · status: ${escape(reference.validation_status)}<br>Sources: FAA NMS primary NOTAM fixture · OpenAIP baseline fixture`;const rows=NotamValidation.compare(reference.soaring_records,reference.records,reference.expected_difference_ids),counts=NotamValidation.summary(rows);document.getElementById('summary').textContent=`MATCH ${counts.MATCH} · INVESTIGATE ${counts.INVESTIGATE} · EXPECTED DIFFERENCE ${counts['EXPECTED DIFFERENCE']} · OpenAIP baseline checks ${reference.openaip_baseline.length}`;document.getElementById('rows').innerHTML=rows.map(row=>`<tr><td>${escape(row.id)}</td><td>${row.present_in_soaring?'yes':'no'}</td><td>${row.present_in_reference?'yes':'no'}</td><td class="${row.classification.replace(' ','')}">${escape(row.classification)}</td><td>${escape(row.differences.map(d=>`${d.field}: ${d.soaring} / ${d.reference}`).join('; ')||'—')}</td></tr>`).join('')}).catch(error=>{document.getElementById('summary').textContent=`Validation data error: ${error.message}`});
</script></body></html>
