<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Soaring NOTAM</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{padding:10px 14px;background:#17375e;color:#fff;display:flex;justify-content:space-between;align-items:center}header h1{font-size:18px;margin:0}.statuses{text-align:right}.status{font-size:12px;opacity:.85}.status.stale{color:#fde68a}.status.error{color:#fecaca;opacity:1}.panel{padding:10px 12px;background:#fff;border-bottom:1px solid #d9e0e8}.controls{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:9px}.field label,.airspace-controls strong{display:block;font-size:11px;font-weight:700;color:#536176;margin-bottom:4px}.field input,.field select,button{width:100%;padding:8px;border:1px solid #c8d1dc;border-radius:7px;background:#fff}button{font-weight:700;cursor:pointer}.primary{background:#17375e;color:#fff;border-color:#17375e}.secondary{background:#edf3f9}.actions,.briefing-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.actions button,.briefing-actions button{width:auto}.airspace-controls{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-top:9px;font-size:12px}.airspace-controls label{display:flex;align-items:center;gap:4px;min-height:28px}.airspace-controls input{width:18px;height:18px}.hint{font-size:12px;color:#66758a;margin:7px 0 0}.workspace{display:grid;grid-template-columns:minmax(0,2fr) minmax(320px,1fr);height:59vh;min-height:430px}#map{height:100%;min-width:0}.briefing-panel{background:#f8fafc;border-left:1px solid #d9e0e8;display:flex;flex-direction:column;min-width:0}.briefing-head{padding:9px 10px;background:#fff;border-bottom:1px solid #d9e0e8}.briefing-head h2{font-size:14px;margin:0}.briefing-actions{margin-top:7px}.briefing-actions button{font-size:11px;padding:6px 8px}.briefing-list{overflow-y:auto;padding:0 9px 12px;scroll-behavior:smooth}.briefing-group>h2{font-size:12px;letter-spacing:.04em;color:#334155;margin:12px 0 4px}.briefing-group>h2.collapsible{cursor:pointer;text-decoration:underline}.briefing-card{background:#fff;border:1px solid #dce3eb;border-left:4px solid #94a3b8;border-radius:7px;padding:8px;margin-top:6px;cursor:pointer;font-size:12px;overflow-wrap:anywhere}.briefing-card.notam{border-left-color:#dc2626}.briefing-card.selected{outline:3px solid #60a5fa;background:#eff6ff}.briefing-card h3{font-size:12px;margin:0 0 3px}.meta{font-size:11px;color:#657287}.match{font-size:11px;font-weight:700;color:#7c3aed;margin:3px 0}.summary{padding:9px 13px;background:#fff;border-top:1px solid #d9e0e8}.summary strong{margin-right:15px}.legs{padding:7px 13px;background:#f8fafc;border-top:1px solid #e5eaf0;font-size:12px;color:#536176;display:flex;gap:14px;flex-wrap:wrap}.popupmeta{font-size:12px;line-height:1.45;color:#405168;margin-top:5px}
@media(max-width:800px){.controls{grid-template-columns:1fr 1fr}.statuses{max-width:55%}.workspace{display:flex;flex-direction:column;height:auto}.workspace #map{height:52vh;min-height:390px}.briefing-panel{border-left:0;border-top:1px solid #d9e0e8;max-height:52vh}.briefing-list{max-height:40vh}.airspace-controls{gap:9px}.briefing-actions button{min-height:36px}body{overflow-x:hidden}}
</style></head><body>
<header><h1>Soaring NOTAM — V2.4</h1><div class="statuses"><div class="status" id="sourceStatus">FAA NMS STAGING · loading…</div><div class="status" id="baselineStatus">OpenAIP baseline · loading…</div></div></header>
<section class="panel"><div class="controls"><div class="field"><label>DATE</label><input id="date" type="date"></div><div class="field"><label>BRIEFING FROM</label><input id="startTime" type="time" value="10:00"></div><div class="field"><label>BRIEFING TO</label><input id="endTime" type="time" value="18:00"></div><div class="field"><label>CORRIDOR</label><select id="corridor"><option value="10">10 km</option><option value="25" selected>25 km</option><option value="50">50 km</option></select></div><div class="field"><label>MAX ALTITUDE</label><select id="alt"><option value="3000">3000 ft</option><option value="6000" selected>6000 ft</option><option value="9500">9500 ft</option><option value="99999">Unlimited</option></select></div><div class="field"><label>TASK</label><select id="taskType"><option value="triangle">Triangle</option><option value="route">Multi-point route</option></select></div></div>
<div class="actions"><button class="primary" id="start">New task</button><button class="secondary" id="undo">Undo point</button><button class="secondary" id="demo">Demo triangle</button></div><div class="airspace-controls" id="airspaceControls"><strong>AIRSPACE</strong><label><input type="checkbox" data-group="prd" checked>P/R/D</label><label><input type="checkbox" data-group="flexible" checked>TRA/TSA/Flexible</label><label><input type="checkbox" data-group="faa" checked>FAA Temporary</label><label><input type="checkbox" data-group="ctr">CTR/MCTR</label><label><input type="checkbox" data-group="tma">TMA/MTMA</label><label><input type="checkbox" data-group="atz">ATZ</label><label><input type="checkbox" data-group="rmztmz">RMZ/TMZ</label></div><p class="hint">Tap HOME → TP1 → TP2. Drag any point to refine the task. The map, task briefing and print view share one filtered briefing state.</p></section>
<main class="workspace"><div id="map"></div><aside class="briefing-panel" id="briefingPanel"><div class="briefing-head"><h2>TASK BRIEFING</h2><div class="briefing-actions"><button class="primary" id="soaringFilter">Soaring filter: ON</button><button class="secondary" id="showRelevant">Show other relevant</button><button class="secondary" id="showAll">Show all</button><button class="secondary" id="printBriefing">Print briefing</button></div></div><div class="briefing-list" id="briefingList"></div></aside></main>
<div class="summary"><strong id="taskInfo">No task</strong><strong id="baselineCount">0 baseline airspaces</strong><strong id="count">0 relevant NOTAMs</strong></div><div class="legs" id="legInfo"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script><script src="relevance.js"></script><script src="airspace.js"></script><script src="schedule.js"></script><script src="matching.js"></script><script src="operational-status.js"></script><script src="briefing.js"></script><script src="app.js"></script></body></html>
