<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Soaring NOTAM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{padding:12px 16px;background:#17375e;color:white;display:flex;justify-content:space-between;align-items:center}header h1{font-size:18px;margin:0}.statuses{text-align:right}.status{font-size:12px;opacity:.85}.panel{padding:12px;background:white;border-bottom:1px solid #d9e0e8}.controls{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px}.field label{display:block;font-size:11px;font-weight:700;color:#536176;margin-bottom:4px}.field input,.field select,button{width:100%;padding:9px;border:1px solid #c8d1dc;border-radius:7px;background:white}button{font-weight:700;cursor:pointer}.primary{background:#17375e;color:white;border-color:#17375e}.secondary{background:#edf3f9}.actions{display:flex;gap:8px;margin-top:10px}.actions button{width:auto}.airspace-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px}.airspace-controls strong{font-size:11px;color:#536176}.airspace-controls label{display:flex;align-items:center;gap:4px;min-height:30px}.airspace-controls input{width:18px;height:18px}.hint{font-size:12px;color:#66758a;margin:8px 0 0}#map{height:58vh;min-height:390px}.summary{padding:10px 14px;background:white;border-top:1px solid #d9e0e8}.summary strong{margin-right:16px}.legs{padding:8px 14px;background:#f8fafc;border-top:1px solid #e5eaf0;font-size:12px;color:#536176;display:flex;gap:16px;flex-wrap:wrap}.notams{padding:0 12px 18px}.card{background:white;border:1px solid #dce3eb;border-radius:8px;padding:10px;margin-top:8px;cursor:pointer}.card:hover{border-color:#8ca8c8}.card h3{font-size:14px;margin:0 0 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.meta{font-size:12px;color:#657287}.badge{font-size:10px;font-weight:800;border-radius:999px;padding:3px 7px;background:#e9eef5;color:#3c4d63}.badge.new{background:#dbeafe;color:#1d4ed8}.badge.changed{background:#fef3c7;color:#92400e}.badge.cancelled{background:#fee2e2;color:#991b1b}.empty{color:#657287;padding:12px 0}.popupmeta{font-size:12px;line-height:1.45;color:#405168;margin-top:5px}@media(max-width:700px){.controls{grid-template-columns:1fr 1fr}#map{height:52vh}.actions{flex-wrap:wrap}.statuses{max-width:55%}}
.status.stale{color:#fde68a;opacity:1}.status.error{color:#fecaca;opacity:1}.notam-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.notam-actions button{width:auto}.group-title{font-size:13px;letter-spacing:.04em;margin:14px 0 2px;color:#334155}.card.high{border-left:4px solid #dc2626}.card.relevant{border-left:4px solid #d97706}.card.other{border-left:4px solid #94a3b8}.relation{font-weight:700;color:#334155}
</style>
</head>
<body>
<header><h1>Soaring NOTAM — V2.2</h1><div class="statuses"><div class="status" id="sourceStatus">FAA NMS STAGING · loading…</div><div class="status" id="baselineStatus">OpenAIP baseline · loading…</div></div></header>
<section class="panel">
<div class="controls">
<div class="field"><label>DATE</label><input id="date" type="date"></div>
<div class="field"><label>CORRIDOR</label><select id="corridor"><option value="10">10 km</option><option value="25" selected>25 km</option><option value="50">50 km</option></select></div>
<div class="field"><label>MAX ALTITUDE</label><select id="alt"><option value="3000">3000 ft</option><option value="6000" selected>6000 ft</option><option value="9500">9500 ft</option><option value="99999">Unlimited</option></select></div>
<div class="field"><label>TASK</label><select id="taskType"><option value="triangle">Triangle</option><option value="route">Multi-point route</option></select></div>
</div>
<div class="actions"><button class="primary" id="start">New task</button><button class="secondary" id="undo">Undo point</button><button class="secondary" id="demo">Demo triangle</button></div>
<div class="airspace-controls" id="airspaceControls"><strong>AIRSPACE</strong><label><input type="checkbox" data-group="prd" checked>P/R/D</label><label><input type="checkbox" data-group="flexible" checked>TRA/TSA/Flexible</label><label><input type="checkbox" data-group="faa" checked>FAA Temporary</label><label><input type="checkbox" data-group="ctr">CTR/MCTR</label><label><input type="checkbox" data-group="tma">TMA/MTMA</label><label><input type="checkbox" data-group="atz">ATZ</label><label><input type="checkbox" data-group="rmztmz">RMZ/TMZ</label></div>
<p class="hint">Tap HOME → TP1 → TP2. Drag any point to refine the task. Your task and settings are saved locally on this device.</p>
</section>
<div id="map"></div>
<div class="summary"><strong id="taskInfo">No task</strong><strong id="baselineCount">0 baseline airspaces</strong><strong id="count">0 relevant NOTAMs</strong></div>
<div class="legs" id="legInfo"></div>
<section class="notams"><div class="notam-actions" id="notamActions"></div><div id="notamList"></div></section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
<script src="relevance.js"></script>
<script src="airspace.js"></script>
<script src="app.js"></script>
</body></html>
